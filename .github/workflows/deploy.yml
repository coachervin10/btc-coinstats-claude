name: Deploy

# Deploys the five Cloudflare Workers under workers/*, runs the paper-store D1 schema
# (safe to re-run -- it's CREATE TABLE IF NOT EXISTS), and publishes site/coinstats-btc.html
# to Cloudflare Pages with the Worker URLs filled in.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   CLOUDFLARE_API_TOKEN     - a Cloudflare API token with Workers Scripts:Edit, D1:Edit,
#                              Workers KV Storage:Edit, Account Settings:Read and
#                              Cloudflare Pages:Edit permissions on your account
#   CLOUDFLARE_ACCOUNT_ID    - your Cloudflare account ID (dashboard right sidebar, or
#                              `wrangler whoami`)
#   COINSTATS_API_KEY        - your CoinStats API key
#   ALPHA_VANTAGE_API_KEY    - your Alpha Vantage API key
#
# Required repo variable (Settings -> Secrets and variables -> Actions -> Variables):
#   CF_ACCOUNT_SUBDOMAIN     - the *.workers.dev subdomain for your account (dashboard ->
#                              Workers & Pages -> look at any existing worker's URL, or the
#                              "Your subdomain" setting), WITHOUT ".workers.dev" --
#                              e.g. if a worker shows up at foo.coachervin10.workers.dev,
#                              this is "coachervin10"
#
# This workflow deliberately does NOT touch kalshi-btc15's existing MCP_PATH_TOKEN secret --
# that worker is already live as a Claude MCP connector and this workflow only adds the new
# REST routes alongside it (see workers/kalshi-btc15/wrangler.toml). If you ever need to
# rotate that secret, run `wrangler secret put MCP_PATH_TOKEN` yourself from that directory.

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy-coinstats-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/coinstats-proxy
          command: deploy
          secrets: |
            COINSTATS_API_KEY
        env:
          COINSTATS_API_KEY: ${{ secrets.COINSTATS_API_KEY }}

  deploy-cryptocom-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cryptocom-proxy
          command: deploy

  deploy-newsflow-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/newsflow-proxy
          command: deploy
          secrets: |
            ALPHA_VANTAGE_API_KEY
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

  deploy-paper-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply D1 schema (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/paper-store
          command: d1 execute btc-paper-store --remote --file=schema.sql
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/paper-store
          command: deploy

  deploy-kalshi-btc15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `secrets:` input here on purpose -- see the note at the top of this file.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/kalshi-btc15
          command: deploy

  deploy-refprice-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Coinbase, Kraken, Bitstamp, Gemini, Bullish and itBit's public ticker endpoints need no
      # API key, so this worker has no secrets to set either.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/refprice-proxy
          command: deploy

  deploy-deribit-iv-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deribit's public options market-data endpoint needs no API key either.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/deribit-iv-proxy
          command: deploy

  deploy-coinbase-balance-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # COINBASE_CDP_KEY_NAME / COINBASE_CDP_PRIVATE_KEY are optional -- the worker degrades to a
      # quiet "not configured" response if they're unset. wrangler-action's `secrets:` input
      # fails outright if the named secret doesn't exist in the repo yet, so the deploy itself and
      # the (optional) secret upload are split into two steps: the first always succeeds, the
      # second only runs once you've actually added the two repo secrets (see README.md).
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/coinbase-balance-proxy
          command: deploy
      - name: Check whether the Coinbase API key secrets are set
        id: coinbase_secrets
        env:
          COINBASE_CDP_KEY_NAME: ${{ secrets.COINBASE_CDP_KEY_NAME }}
        run: echo "configured=$([ -n \"$COINBASE_CDP_KEY_NAME\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Upload Coinbase API key secrets, once you've added them
        if: steps.coinbase_secrets.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/coinbase-balance-proxy
          command: deploy
          secrets: |
            COINBASE_CDP_KEY_NAME
            COINBASE_CDP_PRIVATE_KEY
        env:
          COINBASE_CDP_KEY_NAME: ${{ secrets.COINBASE_CDP_KEY_NAME }}
          COINBASE_CDP_PRIVATE_KEY: ${{ secrets.COINBASE_CDP_PRIVATE_KEY }}

  deploy-site:
    runs-on: ubuntu-latest
    needs:
      - deploy-coinstats-proxy
      - deploy-cryptocom-proxy
      - deploy-newsflow-proxy
      - deploy-paper-store
      - deploy-kalshi-btc15
      - deploy-refprice-proxy
      - deploy-deribit-iv-proxy
      - deploy-coinbase-balance-proxy
    steps:
      - uses: actions/checkout@v4
      - name: Fill in Worker URLs
        run: |
          mkdir -p dist
          if [ -z "${{ vars.CF_ACCOUNT_SUBDOMAIN }}" ]; then
            echo "::warning::CF_ACCOUNT_SUBDOMAIN repo variable is not set -- publishing the page with __CF_SUBDOMAIN__ placeholders still in it. Set the variable (see the comment at the top of this file) and re-run, or edit API_BASE in site/coinstats-btc.html by hand."
            cp site/coinstats-btc.html dist/index.html
          else
            sed "s/__CF_SUBDOMAIN__/${{ vars.CF_ACCOUNT_SUBDOMAIN }}/g" site/coinstats-btc.html > dist/index.html
          fi
      - name: Ensure the Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create btc-coinstats-tracker --production-branch=main
        continue-on-error: true # fails harmlessly once the project already exists
      - name: Deploy site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=btc-coinstats-tracker --branch=main
